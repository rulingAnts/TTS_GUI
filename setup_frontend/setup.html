<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kokoro TTS Studio — Setup</title>
  <style>
    :root {
      --bg:      #0d0d1a;
      --surface: #1a1a2e;
      --border:  #252d45;
      --accent:  #00b4d8;
      --text:    #e8eaf6;
      --muted:   #8892b0;
      --error:   #ff6b6b;
      --success: #06d6a0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-app-region: drag;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 40px 48px;
      gap: 20px;
      -webkit-app-region: no-drag;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo-icon { font-size: 28px; color: var(--accent); }
    .logo-text  { font-size: 18px; font-weight: 700; letter-spacing: 0.03em; }

    h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    /* Progress track */
    .progress-wrap { width: 100%; }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      width: 0%;
      transition: width 0.4s ease;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    #current-file {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 70%;
    }

    /* Status states */
    #status-msg {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      min-height: 18px;
    }

    #status-msg.error   { color: var(--error); }
    #status-msg.success { color: var(--success); }

    /* Buttons */
    .btn {
      display: none;
      padding: 8px 20px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    #btn-retry {
      background: var(--error);
      color: #fff;
    }

    #btn-retry:hover { background: #ff4444; }

    #btn-retry.visible { display: inline-block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-icon">◉</span>
      <span class="logo-text">Kokoro TTS Studio</span>
    </div>

    <h1>First-Run Setup</h1>

    <p class="subtitle">
      Downloading Kokoro model weights from Hugging Face.<br>
      This happens once (~330 MB). The app will open when ready.
    </p>

    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-meta">
        <span id="current-file">Starting…</span>
        <span id="pct-label">0%</span>
      </div>
    </div>

    <p id="status-msg"></p>
    <button class="btn" id="btn-retry" onclick="retryDownload()">Retry</button>
  </div>

  <script>
    function updateProgress(pct, filename) {
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('pct-label').textContent = pct + '%';
      if (filename) {
        // Show just the last two path segments
        const parts = filename.replace(/\\/g, '/').split('/');
        const display = parts.slice(-2).join('/');
        document.getElementById('current-file').textContent = display;
      }
      setStatus('');
    }

    function onDownloadComplete() {
      document.getElementById('progress-fill').style.width = '100%';
      document.getElementById('pct-label').textContent = '100%';
      document.getElementById('current-file').textContent = 'Complete';
      setStatus('Download complete — opening app…', 'success');
    }

    function onDownloadError(msg) {
      setStatus('Error: ' + msg, 'error');
      document.getElementById('btn-retry').classList.add('visible');
    }

    function retryDownload() {
      document.getElementById('btn-retry').classList.remove('visible');
      document.getElementById('progress-fill').style.width = '0%';
      document.getElementById('pct-label').textContent = '0%';
      document.getElementById('current-file').textContent = 'Retrying…';
      setStatus('');
      window.pywebview.api.retry();
    }

    function setStatus(msg, cls) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.className = cls || '';
    }
  </script>
</body>
</html>
