name: Package XTTS v2 Model

# Run manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  download-and-release:
    name: Download XTTS v2 and publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # XTTS v2 doesn't need espeak-ng to download, only to run.
      # Install TTS and its deps (torch CPU-only — we only need the download).
      # We only need huggingface_hub to download the model files —
      # no torch, no torchaudio, no CUDA headaches.
      - name: Install huggingface_hub
        run: pip install --upgrade pip huggingface_hub
        timeout-minutes: 5

      # Download directly from coqui/XTTS-v2 on HuggingFace.
      # The destination directory uses TTS's naming convention so the app
      # finds the files when TTS_HOME is set to the parent.
      - name: Download XTTS v2 model files from HuggingFace
        run: |
          python - <<'PYEOF'
          from huggingface_hub import snapshot_download
          import pathlib

          REPO_ID  = "coqui/XTTS-v2"
          DEST_DIR = "xtts-bundle/tts_models--multilingual--multi-dataset--xtts_v2"

          print(f"Downloading {REPO_ID} → {DEST_DIR} …")
          snapshot_download(
              repo_id=REPO_ID,
              local_dir=DEST_DIR,
              ignore_patterns=["*.md", ".gitattributes"],
          )

          # Sanity-check key files
          dest = pathlib.Path(DEST_DIR)
          for fname in ["model.pth", "config.json", "vocab.json",
                        "speakers_xtts.pth"]:
              p = dest / fname
              size_mb = p.stat().st_size / 1_048_576 if p.exists() else 0
              status  = f"{size_mb:.0f} MB" if p.exists() else "MISSING ✗"
              print(f"  {fname}: {status}")

          print("✓ Download complete")
          PYEOF
        timeout-minutes: 30

      # Write a README into the bundle so the user knows what to do.
      - name: Write README
        run: |
          cat > xtts-bundle/README.txt <<'EOF'
          Kokoro TTS Studio — XTTS v2 offline model bundle
          ==================================================

          Contents
          --------
          tts_models--multilingual--multi-dataset--xtts_v2/
            model.pth           Main XTTS v2 model weights (~1.6 GB)
            config.json         Model configuration
            vocab.json          Vocabulary file
            speakers_xtts.pth   Built-in speaker embeddings
            (other files)

          How to install
          --------------
          Run setup_offline.py with the --xtts flag:

              python setup_offline.py --xtts /path/to/this.zip

          Or drop the zip in ~/Downloads and run:

              python setup_offline.py --xtts

          The script extracts the model to:
            macOS:   ~/Library/Application Support/KokoroTTSStudio/models/xtts/
            Windows: %APPDATA%\KokoroTTSStudio\models\xtts\

          After extraction, launch the app and click the XTTS v2 engine tab.
          Click "Load XTTS v2" (no download needed — uses the local files).

          License
          -------
          XTTS v2: Coqui Public Model License 1.0
          https://coqui.ai/cpml
          EOF

      # Zip the bundle.
      - name: Create zip archive
        id: zip
        run: |
          DATE=$(date -u +%Y%m%d)
          ZIP_NAME="xtts-v2-model-${DATE}.zip"
          zip -r "$ZIP_NAME" xtts-bundle/
          SIZE=$(du -sh "$ZIP_NAME" | cut -f1)
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "date=$DATE"         >> "$GITHUB_OUTPUT"
          echo "Created $ZIP_NAME ($SIZE)"

      # Upload as a workflow artifact (90-day backup).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtts-v2-model-${{ steps.zip.outputs.date }}
          path: ${{ steps.zip.outputs.zip_name }}
          retention-days: 90

      # Attach zip to the most recent existing release.
      # If no release exists yet, create a pre-release as a fallback.
      - name: Attach to existing release (or create pre-release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="${{ steps.zip.outputs.zip_name }}"

          # Find the most recent release tag (including pre-releases)
          LATEST_TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 1 \
            --json tagName \
            -q '.[0].tagName' 2>/dev/null || echo "")

          if [ -n "$LATEST_TAG" ]; then
            echo "Adding $ZIP to existing release: $LATEST_TAG"
            gh release upload "$LATEST_TAG" "$ZIP" \
              --repo "${{ github.repository }}" \
              --clobber
            echo ""
            echo "✅ Uploaded to existing release:"
            echo "   ${{ github.server_url }}/${{ github.repository }}/releases/tag/$LATEST_TAG"
          else
            # No releases yet — create a pre-release
            TAG="model-weights-${{ steps.zip.outputs.date }}"
            echo "No existing release found — creating pre-release: $TAG"
            gh release create "$TAG" \
              --title "Model Weights — ${{ steps.zip.outputs.date }}" \
              --prerelease \
              --notes "Pre-packaged model weights for Kokoro TTS Studio (XTTS v2)." \
              --repo "${{ github.repository }}" \
              "$ZIP"
            echo ""
            echo "✅ Pre-release created:"
            echo "   ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          fi
